name: Build DayLoop Android APK
on:
  workflow_dispatch:
  push:
    paths: ['mobile/**', '.github/workflows/android-apk.yml']
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci || npm install
      - run: npm test
      - run: npx cap add android
      - run: node scripts/patch-android.mjs
      - run: npx @capacitor/assets generate --android --assetPath resources
      - run: npx cap sync android
      - name: Debug APK
        run: ./gradlew assembleDebug
        working-directory: mobile/android
      - name: Signed release APK + AAB (only when signing secrets exist)
        env:
          KS_B64: ${{ secrets.DAYLOOP_KEYSTORE_B64 }}
          DAYLOOP_STORE_PASSWORD: ${{ secrets.DAYLOOP_STORE_PASSWORD }}
          DAYLOOP_KEY_ALIAS: ${{ secrets.DAYLOOP_KEY_ALIAS }}
          DAYLOOP_KEY_PASSWORD: ${{ secrets.DAYLOOP_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/dayloop.jks"
            export DAYLOOP_STORE_FILE="$RUNNER_TEMP/dayloop.jks"
            ./gradlew assembleRelease bundleRelease
          else echo "No signing secrets configured; skipping release build"; fi
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: DayLoop-android
          path: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/android/app/build/outputs/apk/release/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab
