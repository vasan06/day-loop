<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#69465f">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<title>DayLoop</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="splash"><div class="brand-mark"><span></span><span></span><span></span></div><b>Day<i>Loop</i></b></div>
<main id="view" class="view" tabindex="-1"></main>
<button id="fab" class="fab" hidden aria-label="Add">+</button>
<nav id="tabbar" class="tabbar" aria-label="Main">
  <button data-t="today"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg><span>Today</span></button>
  <button data-t="tasks"><svg viewBox="0 0 24 24"><path d="M5 12l4 4 10-10"/></svg><span>Tasks</span></button>
  <button data-t="habits"><svg viewBox="0 0 24 24"><path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-9z"/></svg><span>Habits</span></button>
  <button data-t="money"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg><span>Money</span></button>
  <button data-t="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg><span>More</span></button>
</nav>
<div id="sheet" class="sheet" aria-hidden="true"></div>
<div id="toasts" aria-live="polite"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
