
name: Build DayLoop Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'DayLoop-mobile-app-v1.1-source/mobile/**'
      - '.github/workflows/dayloop-android.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DayLoop-mobile-app-v1.1-source/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Add Android platform
        run: npx cap add android

      - name: Configure Android
        run: node scripts/patch-android.mjs

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: ./gradlew assembleDebug
        working-directory: DayLoop-mobile-app-v1.1-source/mobile/android

      - uses: actions/upload-artifact@v4
        with:
          name: DayLoop-debug-apk
          path: DayLoop-mobile-app-v1.1-source/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
